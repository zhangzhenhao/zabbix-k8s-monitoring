          description: '发现 severity=warning 的活跃告警'
          lld_macro_paths:
            - lld_macro: '{#FINGERPRINT}'
              path: $.FINGERPRINT
            - lld_macro: '{#ALERTNAME}'
              path: $.ALERTNAME
            - lld_macro: '{#SEVERITY}'
              path: $.SEVERITY
            - lld_macro: '{#NAMESPACE}'
              path: $.NAMESPACE
            - lld_macro: '{#POD}'
              path: $.POD
            - lld_macro: '{#INSTANCE}'
              path: $.INSTANCE
            - lld_macro: '{#JOB}'
              path: $.JOB
            - lld_macro: '{#NODE}'
              path: $.NODE
            - lld_macro: '{#CONTAINER}'
              path: $.CONTAINER
            - lld_macro: '{#CLUSTER}'
              path: $.CLUSTER
            - lld_macro: '{#TEAM}'
              path: $.TEAM
            - lld_macro: '{#SUMMARY}'
              path: $.SUMMARY
            - lld_macro: '{#DESCRIPTION}'
              path: $.DESCRIPTION
            - lld_macro: '{#RUNBOOK_URL}'
              path: $.RUNBOOK_URL
            - lld_macro: '{#STARTS_AT}'
              path: $.STARTS_AT
          item_prototypes:
            - uuid: 4e82162689d74d7fbf72361b9c2f6c73
              name: 'Alert detail {#ALERTNAME}'
              type: DEPENDENT
              key: 'am.alert.detail.warning[{#FINGERPRINT}]'
              delay: '0'
              history: 7d
              value_type: TEXT
              trends: '0'
              description: 告警的归一化明细（labels/annotations/startsAt）
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var fp = '{#FINGERPRINT}';
                      var key, list, i;
                      for (key in data.groups) {
                          if (!data.groups.hasOwnProperty(key)) {
                              continue;
                          }
                          list = data.groups[key];
                          for (i = 0; i < list.length; i++) {
                              if (list[i].FINGERPRINT === fp) {
                                  return JSON.stringify(list[i]);
                              }
                          }
                      }
                      return '{}';
              master_item:
                key: am.alerts.raw
            - uuid: 29de55909f2f486eb4d428a6c4e5e0fe
              name: 'Alert state [{#SEVERITY}] {#ALERTNAME}'
              type: DEPENDENT
              key: 'am.alert.state.warning[{#FINGERPRINT}]'
              delay: '0'
              history: 7d
              trends: '0'
              description: '1 = 告警在 Alertmanager 中处于 active 状态，0 = 告警已消失（恢复）'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var fp = '{#FINGERPRINT}';
                      var key, list, i;
                      for (key in data.groups) {
                          if (!data.groups.hasOwnProperty(key)) {
                              continue;
                          }
                          list = data.groups[key];
                          for (i = 0; i < list.length; i++) {
                              if (list[i].FINGERPRINT === fp) {
                                  return 1;
                              }
                          }
                      }
                      return 0;
              master_item:
                key: am.alerts.raw
              tags:
                - tag: component
                  value: alertmanager
                - tag: severity
                  value: '{#SEVERITY}'
              trigger_prototypes:
                - uuid: 0e83b002ac4e48f7810a627aedc4f08a
                  expression: 'last(/Kubernetes Alertmanager by HTTP/am.alert.state.warning[{#FINGERPRINT}])=1'
                  name: 'K8s Alert: {#ALERTNAME} [{#SEVERITY}]'
                  url: '{#RUNBOOK_URL}'
                  priority: AVERAGE
                  description: |
                    {#SUMMARY}
                    
                    {#DESCRIPTION}
                    
                    namespace: {#NAMESPACE}
                    pod: {#POD}
                    instance: {#INSTANCE}
                    job: {#JOB}
                    startsAt: {#STARTS_AT}
                    runbook: {#RUNBOOK_URL}
                  tags:
                    - tag: alertname
                      value: '{#ALERTNAME}'
                    - tag: namespace
                      value: '{#NAMESPACE}'
                    - tag: pod
                      value: '{#POD}'
                    - tag: severity
                      value: '{#SEVERITY}'
                    - tag: source
                      value: alertmanager
          master_item:
            key: am.alerts.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.groups.warning
      tags:
        - tag: class
          value: application
        - tag: provider
          value: alertmanager
        - tag: target
          value: kubernetes
      macros:
        - macro: '{$ALERTMANAGER.ALERT_FILTER_QUERY}'
          value: 'active=true&silenced=false&inhibited=false'
          description: 'Alertmanager /api/v2/alerts 查询参数'
        - macro: '{$ALERTMANAGER.NODATA_PERIOD}'
          value: 10m
          description: 超过该时间未取到数据则触发可用性告警
        - macro: '{$ALERTMANAGER.POLL_INTERVAL}'
          value: 1m
          description: 告警拉取间隔
        - macro: '{$ALERTMANAGER.URL}'
          value: 'http://rancher-monitoring-alertmanager.cattle-monitoring-system.svc:9093'
          description: 'Alertmanager 基础 URL（不含结尾斜杠）'

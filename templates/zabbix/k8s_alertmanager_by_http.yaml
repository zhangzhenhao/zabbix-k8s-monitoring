                              continue;
                          }
                          list = data.groups[key];
                          for (i = 0; i < list.length; i++) {
                              if (list[i].FINGERPRINT === fp) {
                                  return 1;
                              }
                          }
                      }
                      return 0;
              master_item:
                key: am.alerts.raw
              tags:
                - tag: component
                  value: alertmanager
                - tag: severity
                  value: '{#SEVERITY}'
              trigger_prototypes:
                - uuid: eae76950ccec45848b3ec85019e62aa2
                  expression: 'last(/Kubernetes Alertmanager by HTTP/am.alert.state.critical[{#FINGERPRINT}])=1'
                  name: 'K8s Alert: {#ALERTNAME} [{#SEVERITY}]'
                  url: '{#RUNBOOK_URL}'
                  priority: DISASTER
                  description: |
                    {#SUMMARY}
                    

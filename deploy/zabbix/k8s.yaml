# 单副本 Zabbix 7.0 测试环境（PostgreSQL + Zabbix Server + Zabbix Web）
# 用途：验证 Kubernetes Alertmanager 告警接入 Zabbix 的方案
apiVersion: v1
kind: Namespace
metadata:
  name: zabbix
  labels:
    app.kubernetes.io/part-of: zabbix-test
---
apiVersion: v1
kind: Secret
metadata:
  name: zabbix-db
  namespace: zabbix
type: Opaque
stringData:
  POSTGRES_USER: zabbix
  POSTGRES_PASSWORD: "Zabbix_7_pwd"
  POSTGRES_DB: zabbix
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zabbix-pgdata
  namespace: zabbix
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-postgres
  namespace: zabbix
  labels:
    app: zabbix-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zabbix-postgres
  template:
    metadata:
      labels:
        app: zabbix-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: zabbix-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "zabbix", "-d", "zabbix"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zabbix-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-postgres
  namespace: zabbix
spec:
  selector:
    app: zabbix-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-server
  namespace: zabbix
  labels:
    app: zabbix-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zabbix-server
  template:
    metadata:
      labels:
        app: zabbix-server
    spec:
      containers:
        - name: zabbix-server
          image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
          envFrom:
            - secretRef:
                name: zabbix-db
          env:
            - name: DB_SERVER_HOST
              value: zabbix-postgres
            - name: ZBX_TIMEOUT
              value: "10"
            - name: ZBX_CACHESIZE
              value: 64M
          ports:
            - name: zabbix-trapper
              containerPort: 10051
          readinessProbe:
            tcpSocket:
              port: 10051
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-server
  namespace: zabbix
spec:
  selector:
    app: zabbix-server
  ports:
    - name: zabbix-trapper
      port: 10051
      targetPort: 10051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
  namespace: zabbix
  labels:
    app: zabbix-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-web
  template:
    metadata:
      labels:
        app: zabbix-web
    spec:
      containers:
        - name: zabbix-web
          image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
          envFrom:
            - secretRef:
                name: zabbix-db
          env:
            - name: ZBX_SERVER_HOST
              value: zabbix-server
            - name: ZBX_SERVER_PORT
              value: "10051"
            - name: DB_SERVER_HOST
              value: zabbix-postgres
            - name: PHP_TZ
              value: Asia/Shanghai
            - name: ZBX_SERVER_NAME
              value: Zabbix 7.0 Test
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-web
  namespace: zabbix
spec:
  selector:
    app: zabbix-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080

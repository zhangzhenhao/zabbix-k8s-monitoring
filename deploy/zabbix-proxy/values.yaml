# Zabbix 官方 kubernetes-helm chart 的 values 覆盖（开发环境）
# chart 来源: https://git.zabbix.com/scm/zt/kubernetes-helm.git (master)
# 用法: helm install zabbix <chart-dir> -n zabbix-monitoring --create-namespace -f deploy/zabbix-proxy/values.yaml
#
# 本集群已通过 rancher-monitoring 部署了 kube-state-metrics 和 prometheus-node-exporter，
# 这里禁用 chart 自带的这两个组件，仅部署 Zabbix Proxy + Zabbix Agent。

kubeStateMetrics:
  enabled: false

prometheusNodeExporter:
  enabled: false

# ---- Zabbix Proxy（active 模式，回连集群内的 Zabbix Server）----
zabbixProxy:
  image:
    # 与集群内 Zabbix Server 7.0 保持一致，避免协议/配置不兼容
    tag: alpine-7.0-latest
  env:
    - name: ZBX_PROXYMODE
      value: 0          # 0 = active proxy
    - name: ZBX_HOSTNAME
      value: zabbix-proxy-k8s   # 必须与 Zabbix 中注册的 proxy 名一致
    - name: ZBX_SERVER_HOST
      value: "zabbix-server.zabbix.svc"   # 集群内 Zabbix Server（在 zabbix namespace）
    - name: ZBX_DEBUGLEVEL
      value: 3
    - name: ZBX_CACHESIZE
      value: 128M
    - name: ZBX_PROXYCONFIGFREQUENCY
      value: 10
    - name: ZBX_STARTHTTPPOLLERS
      value: 8        # 官方 K8s 模板大量使用 HTTP agent，默认 1 个轮询器太慢
    - name: ZBX_STARTPOLLERS
      value: 10
  # 首次启动需建库 + 从 server 拉取配置，放宽启动探针窗口避免被误杀
  startupProbe:
    enabled: true
    tcpSocket:
      port: zabbix-proxy
    initialDelaySeconds: 30
    timeoutSeconds: 3
    failureThreshold: 12
    periodSeconds: 10
    successThreshold: 1

# ---- Zabbix Agent2（DaemonSet，每节点一个，供节点发现后被动采集）----
zabbixAgent:
  enabled: true
  image:
    tag: alpine-7.0-latest
  env:
    # 注意：不要再同时设置 ZBX_PASSIVESERVERS，否则 entrypoint 会把 0.0.0.0/0 重复写入 Server= 导致配置校验失败
    - name: ZBX_SERVER_HOST
      value: "0.0.0.0/0"
    - name: ZBX_SERVER_PORT
      value: 10051
    - name: ZBX_PASSIVE_ALLOW
      value: true
    - name: ZBX_ACTIVE_ALLOW
      value: false
    - name: ZBX_DEBUGLEVEL
      value: 3
    - name: ZBX_TIMEOUT
      value: 4
  # RKE2 控制面节点带有 CriticalAddonsOnly:NoExecute taint，需容忍才能在所有节点部署 agent
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
    - effect: NoExecute
      key: CriticalAddonsOnly
      operator: Exists
